[package]
name = "sigil-core"
version = "0.0.0"
edition = "2021"
# MSRV bumped 1.74 -> 1.85 solely for the `ml-dsa` crate (see below): ml-dsa
# 0.1.1 is `edition = "2024"` / `rust-version = "1.85"`, and no 1.74-compatible
# release exists. Every other dep here still builds on 1.74; this bump is the
# minimum ml-dsa requires. The actual toolchain is newer, so it compiles.
rust-version = "1.85"
publish = false
license = "Apache-2.0 OR MIT"
description = "Pure heart of libsigil: crypto-agility envelope + algorithm-suite registry, with a real-but-unaudited XChaCha20-Poly1305 AEAD layer and an Argon2id password-stretching KDF building block. Pre-audit skeleton."

[lib]
# Pure logic, no_std-compatible (see lib.rs). Builds for wasm32-unknown-unknown.

[dependencies]
# Real AEAD layer (pre-audit). Default features are disabled on every crate so
# that NOTHING pulls in `getrandom` — `getrandom`'s default backend has no
# implementation for `wasm32-unknown-unknown`, which would break the web/extension
# build. We pass nonces in from the caller, so the AEAD never needs an RNG. The
# `alloc` feature gives us `Vec`-based encrypt/decrypt on this no_std crate.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
# Argon2id password-stretching KDF (pre-audit). `default-features = false` keeps
# `getrandom` out: argon2's default `rand`/`password-hash` features pull in
# `rand_core` (and thus `getrandom`), which has no `wasm32-unknown-unknown`
# backend and would break the web/extension build. We never generate a salt here
# — the caller supplies it — so no RNG is needed. The `alloc` feature provides
# the scratch memory block that `Argon2::hash_password_into` allocates.
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
# Classical Ed25519 signatures (pre-audit) — the Ed25519 half of the hybrid
# Ed25519&ML-DSA-65 suite (the ML-DSA-65 PQ half is future/unimplemented).
# `default-features = false` disables the `rand_core` feature, which keeps
# `getrandom` out and preserves the `wasm32-unknown-unknown` build; we never
# generate keys here, so no RNG is needed — the caller supplies the 32-byte
# secret seed and we derive/sign/verify deterministically. `from_bytes` (seed →
# keypair), `sign`, and `verify_strict` are all RNG-free. The `alloc` feature is
# not needed by these fixed-size raw-byte calls.
ed25519-dalek = { version = "3", default-features = false }
# Classical X25519 Diffie-Hellman key agreement (pre-audit) — the classical KEX
# half of the hybrid X25519&ML-KEM-768 suite (the ML-KEM-768 PQ KEM half is
# future/unimplemented). `default-features = false` keeps `getrandom` out: the
# opt-in `getrandom` feature is the only thing that pulls it in (it is NOT a
# default feature), and disabling defaults also drops `zeroize`, `alloc`, and the
# precomputed base-point tables — none of which the raw path needs — so the
# `wasm32-unknown-unknown` build is preserved. We use only the low-level
# raw-bytes API: the free function `x25519(scalar, point)` and the
# `X25519_BASEPOINT_BYTES` const, neither of which draws randomness. We never
# generate keys here — the caller supplies the 32-byte secret scalar, exactly as
# it supplies the Argon2id salt, AEAD nonce, and Ed25519 seed. This shares the
# already-resolved `curve25519-dalek` 4.x with `ed25519-dalek`, so it adds little.
x25519-dalek = { version = "2", default-features = false }
# Post-quantum ML-KEM-768 (FIPS 203) key encapsulation (pre-audit) — the
# post-quantum KEM half of the hybrid X25519&ML-KEM-768 suite (the classical
# X25519 KEX half lives in `kx.rs`). `default-features = false` keeps `getrandom`
# out: ml-kem's only randomness enters through `rand_core`, and with defaults off
# `rand_core` is pulled WITHOUT its `getrandom` feature, so nothing reaches for a
# `wasm32-unknown-unknown` backend and the web/extension build is preserved (the
# `std` feature stays off too). We enable ONLY the `deterministic` feature, which
# exposes the FIPS 203 KAT entry points — `KemCore::generate_deterministic(d, z)`
# for keygen and `EncapsulateDeterministic::encapsulate_deterministic(m)` for
# encapsulation — so the caller supplies the keygen seed (d‖z) and the encaps coin
# (m), exactly as it supplies the Argon2id salt, AEAD nonce, X25519 scalar, and
# Ed25519 seed elsewhere. `sigil-core` therefore still generates NO randomness.
# Decapsulation is deterministic and total (FIPS 203 implicit rejection). Keys and
# ciphertexts cross our raw-bytes API as fixed-size arrays via `EncodedSizeUser`.
ml-kem = { version = "0.2.3", default-features = false, features = ["deterministic"] }
# Post-quantum ML-DSA-65 (FIPS 204) module-lattice digital signatures (pre-audit)
# — the post-quantum SIGNATURE half of the hybrid Ed25519&ML-DSA-65 suite (the
# classical Ed25519 half lives in `sig.rs`). `default-features = false` is what
# keeps `getrandom` out: ml-dsa's randomness enters ONLY through its optional
# `getrandom` (and `rand_core`) features, which we do NOT enable — with defaults
# off, `getrandom` and `rand_core` are never selected, so nothing reaches for a
# `wasm32-unknown-unknown` backend and the web/extension build is preserved
# (`pkcs8` is likewise off). We enable ONLY `alloc` (heap-backs the large key
# structures; it does NOT pull `getrandom`). We use the FIPS 204 DETERMINISTIC
# entry points exclusively: `ExpandedSigningKey::from_seed(xi)` for keygen (caller
# supplies the 32-byte seed xi) and `sign_deterministic(msg, &[])` for signing
# (rnd = 0, so the signature is a pure function of `(sk, message)` — no RNG),
# exactly as the caller supplies the Argon2id salt, AEAD nonce, X25519 scalar,
# ML-KEM seed/coin, and Ed25519 seed elsewhere. `sigil-core` therefore still
# generates NO randomness. This is `edition = "2024"` / MSRV 1.85 (the reason for
# the rust-version bump above). Keys/signatures cross our raw-bytes API as
# fixed-size arrays via the crate's `Encoded*`/`ExpandedSigningKeyBytes` types.
# NOTE: ml-dsa 0.1.x pulls its own major versions of `hybrid-array` (0.4),
# `signature` (3), and `crypto-common` (0.2) — distinct from ml-kem's 0.2.x /
# ed25519's `signature` 2.x — so the tree carries both; none of them add
# `getrandom`.
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc"] }
# HOTP/TOTP one-time-password primitive (RFC 4226 / RFC 6238). `hmac` provides
# the keyed MAC; it was already in the tree transitively (hkdf 0.12 pulls the same
# hmac 0.12), and we now depend on it DIRECTLY for the OTP HMAC. `sha1` is NEW:
# the TOTP default (and the near-universal choice for real 2FA apps and
# `otpauth://` provisioning) is HMAC-SHA-1, so interop REQUIRES it; `sha2`
# (SHA-256/512) is already a dep above. Both are `default-features = false`, which
# is what keeps them RNG-free — neither has any `getrandom`/`rand` feature enabled
# — so the wasm32-unknown-unknown / no_std build is preserved. The OTP code reads
# no clock either: the caller passes the Unix time in (see `totp.rs`).
hmac = { version = "0.12", default-features = false }
sha1 = { version = "0.10", default-features = false }
