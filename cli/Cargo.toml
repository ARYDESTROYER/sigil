# sigil-cli — a tiny, standalone demonstration binary over the libsigil core.
#
# STATUS: pre-audit. This crate seals/opens a single file with the REAL but
# UNAUDITED `sigil-core` record API (Argon2id -> XChaCha20-Poly1305 envelope).
# It is a demonstration of the libsigil building block only and MUST NOT be used
# to protect real secrets. See README.md for the loud warning and the on-disk
# container format.
#
# IMPORTANT: this crate is INTENTIONALLY OUTSIDE the `libsigil/` cargo workspace.
# It has its own `cli/Cargo.lock`. Keeping it separate is what lets it depend on
# `getrandom` for native randomness without ever touching `libsigil/Cargo.lock`
# — `sigil-core` compiles to `wasm32-unknown-unknown`, where `getrandom` has no
# backend, so the libsigil workspace lockfile MUST stay getrandom-free. This
# binary is native-only (never wasm), so `getrandom` is fine HERE.
[package]
name = "sigil-cli"
version = "0.0.0"
edition = "2021"
# 1.85: this path-depends on sigil-core, which pulls ml-dsa 0.1.1 (edition 2024,
# MSRV 1.85). The machine toolchain is 1.96, so it builds; CI pins stable.
rust-version = "1.85"
publish = false
license = "Apache-2.0 OR MIT"
description = "Pre-audit demonstration CLI that seals/opens a file with the real-but-unaudited libsigil sigil-core record API. Not for real secrets."

[[bin]]
name = "sigil"
path = "src/main.rs"

[lib]
name = "sigil_cli"
path = "src/lib.rs"

[dependencies]
# The real (UNAUDITED) crypto building block. Path dependency only; this does NOT
# add `cli` to the libsigil workspace.
sigil-core = { path = "../libsigil/core" }
# Native CSPRNG for the salt and nonce. Safe to use here because this crate is a
# native binary and is NEVER compiled to wasm32 (where getrandom has no backend).
# It lives in `cli/Cargo.lock`, never in `libsigil/Cargo.lock`.
getrandom = "0.2"

# --- Sync (push/pull) deps: native-only, dev/localhost, PLAIN HTTP. ---------
# These move OPAQUE sealed containers to/from sigild's DEV-ONLY, unauthenticated
# op-log over plain HTTP on localhost. Like `getrandom` above, they are
# native-only and live exclusively in `cli/Cargo.lock` — they are NEVER added to
# `libsigil/Cargo.lock` (the wasm-pure core must not gain these).
#
# `default-features = false` strips ureq's TLS stack: this is intentional. The
# CLI talks PLAIN HTTP to a localhost dev sigild only — no TLS, no real secrets.
ureq = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# SHA-256 for the device-enrollment challenge: the enrollment token is bound into
# the signed message as its lowercase-hex SHA-256 digest (sigild's
# `EnrollTokenHash`), so the plaintext token is never signed. This is a HASH only
# — all encryption/signing still happens in sigil-core. `default-features = false`
# keeps it no_std-ish and getrandom-free; the crate is ALREADY in this lockfile
# transitively via sigil-core, so this adds a dep EDGE, not a new package.
sha2 = { version = "0.10", default-features = false }
