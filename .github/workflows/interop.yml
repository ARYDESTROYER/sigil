name: interop

# The cross-component interop suite — the tests that prove the SYSTEM works, as
# opposed to the per-component suites that prove each part works alone.
#
# WHY THIS WORKFLOW EXISTS: these Node tests were, until this workflow was added,
# run by NO workflow at all. They are the only automated proof of several
# load-bearing claims, including the one that matters most:
#   * roundtrip          — seal/open through the wasm in a JS runtime
#   * interop            — SIGILcli container, wasm <-> the REAL sigil binary
#   * hybrid-interop     — SIGILhyb PQ-hybrid container, both directions
#   * sync-interop       — the E2EE sync loop against a LIVE sigild
#   * totp-interop       — cross-client TOTP (CLI writes, browser reads)
#   * migration-interop  — the Google Authenticator codec agrees Rust <-> JS
#   * device-auth-interop— contract v3 against a live device-auth server
#   * sharing-interop    — vault sharing, browser <-> CLI, both directions
#   * pinning-interop    — the KEY-SUBSTITUTION ATTACK is detected and refused
#   * accounts-interop   — the ACCOUNT model: a JS client and the real CLI in ONE
#                          account, and a revoked claimant no longer orphans a vault
# A test nobody runs is a test that rots, and these guard the invariants that
# three separate implementations (Go, Rust, JS) have to agree on.
#
# TWO FURTHER JOBS run the shell end-to-end proofs, which were in the same
# position — written, known-green locally, and executed by nothing:
# e2e-sharing.sh (device-to-device vault sharing) and e2e-accounts.sh (accounts
# own vaults and carry entitlement).
#
# It is a heavier job than the others because it genuinely needs all three
# toolchains at once: Rust + wasm to build the bindings, Cargo to build the real
# `sigil` binary, Go to build the real `sigild`, and Node to drive them.
#
# HONESTY NOTE: like the repo's other CI mirrors, this workflow is validated
# locally (YAML-parsed, and every step mirrors a known-green local command) but
# has NOT been run on real GitHub Actions from the build machine.

on:
  push:
    paths:
      - "sigil-wasm/**"
      - "cli/**"
      - "sigild/**"
      - "libsigil/**"
      - "rust-toolchain.toml"
      - ".github/workflows/interop.yml"
  pull_request:
    paths:
      - "sigil-wasm/**"
      - "cli/**"
      - "sigild/**"
      - "libsigil/**"
      - "rust-toolchain.toml"
      - ".github/workflows/interop.yml"

permissions:
  contents: read

jobs:
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Prebuilt binaries so build-wasm.sh finds `wasm-pack` / `wasm-bindgen` on
      # PATH under Linux. The wasm-bindgen version is pinned to match the
      # `=0.2.100` dependency in sigil-wasm/Cargo.toml.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.100,wasm-pack

      # Several of these tests build and boot the REAL sigild.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: sigild/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            sigil-wasm
            cli

      # The sigil-wasm crate had NO CI lint/test gate of its own. Its 26 tests
      # include container_header_is_golden and hybrid_container_prefix_is_golden,
      # which guard the SIGILcli / SIGILhyb constants that CLAUDE.md requires to
      # stay byte-identical with cli/src/lib.rs — exactly the kind of mirrored
      # invariant that drifts silently when nothing checks it.
      - name: sigil-wasm rustfmt
        run: cargo fmt --manifest-path sigil-wasm/Cargo.toml --all -- --check
      - name: sigil-wasm clippy
        run: cargo clippy --manifest-path sigil-wasm/Cargo.toml --all-targets -- -D warnings
      - name: sigil-wasm tests (incl. the golden format-constant guards)
        run: cargo test --manifest-path sigil-wasm/Cargo.toml

      # Emits pkg-web + pkg-node. The tests import pkg-node.
      - name: Build the wasm bindings
        run: ./sigil-wasm/build-wasm.sh

      # Built once here so the first test does not pay for it (each test also
      # builds it itself, which is then a cache hit).
      - name: Build the real sigil CLI
        run: cargo build --manifest-path cli/Cargo.toml --bin sigil

      - name: 1/10 wasm seal/open round-trip
        run: node sigil-wasm/test/roundtrip.mjs
      - name: 2/10 SIGILcli container interop with the real CLI
        run: node sigil-wasm/test/interop.mjs
      - name: 3/10 SIGILhyb hybrid public-key interop
        run: node sigil-wasm/test/hybrid-interop.mjs
      - name: 4/10 E2EE sync loop against a live sigild
        run: node sigil-wasm/test/sync-interop.mjs
      - name: 5/10 cross-client TOTP through the opaque op-log
        run: node sigil-wasm/test/totp-interop.mjs
      - name: 6/10 TOTP migration codec agrees Rust and JS
        run: node sigil-wasm/test/migration-interop.mjs
      - name: 7/10 device auth contract v3
        run: node sigil-wasm/test/device-auth-interop.mjs
      - name: 8/10 vault sharing, browser and CLI, both directions
        run: node sigil-wasm/test/sharing-interop.mjs
      # The most important one: proves a hostile server swapping a recipient's
      # hybrid public key is DETECTED and REFUSED, and that the Rust and JS
      # safety numbers agree.
      - name: 9/10 key pinning blocks the substitution attack
        run: node sigil-wasm/test/pinning-interop.mjs
      # Phase 52. A browser-style JS client speaks the ACCOUNT model against a
      # live sigild, and it is the SAME account the real `sigil` CLI joins: the
      # CLI redeems a JS-minted invite, a revoked claimant's sibling still reads
      # AND writes the vault (the orphaning defect this phase exists to fix), a
      # separate account is 403, and the invite negatives (reuse, foreign handle,
      # quota) all hold.
      - name: 10/10 the account model, browser client and CLI in one account
        run: node sigil-wasm/test/accounts-interop.mjs

      - name: Assert the libsigil core stays getrandom-free
        run: |
          for lock in libsigil/Cargo.lock sigil-wasm/Cargo.lock; do
            count=$(grep -c 'name = "getrandom"' "$lock" || true)
            echo "$lock getrandom entries: $count"
            test "$count" -eq 0
          done

  # A cross-component proof that is a shell script rather than a Node test —
  # which is exactly why it, too, was running in NO workflow before this file
  # existed. It boots a REAL sigild with dev-ops + device auth v3 on a free
  # loopback port and drives the REAL sigil binary as three separate devices to
  # prove device-to-device vault sharing end to end, including the negative half
  # (a third device gets 403s, a revoked device gets 401s) and the zero-knowledge
  # half (the stored bytes are the opaque envelope, and the server logs never
  # contain it). Nothing here is mocked, so nothing here can quietly stop being
  # true without this failing.
  #
  # It needs Go + Rust + bash + curl + python3 (for a free port) and NO wasm, so
  # it is a separate job from the Node suite above and runs in parallel with it.
  #
  # HONESTY NOTE: as above — validated locally (the script is a known-green local
  # command and this job mirrors it) but never run on real GitHub Actions.
  e2e-sharing:
    name: end-to-end vault sharing (real sigild + real CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: sigild/go.sum

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      # The script resolves the Go toolchain from $GO, then Homebrew, then PATH;
      # naming it here keeps the runner off the macOS-only path entirely.
      - name: device-to-device vault sharing, end to end
        env:
          GO: go
        run: ./cli/tests/e2e-sharing.sh

  # The ELEVENTH cross-component proof, added with the Phase 52 account model and
  # in exactly the position `e2e-sharing.sh` was in before this workflow existed:
  # run by nothing. It boots a REAL sigild with dev-ops + device auth and drives
  # the REAL `sigil` binary as several devices to prove that an ACCOUNT — not a
  # device — owns vaults and carries entitlement: a device joins by single-use
  # invite, the vault claimant is revoked and a SIBLING still reads, writes,
  # grants and rotates (the orphaning defect this phase fixes), a device in
  # another account is 403 throughout, a revoked device frees its seat, and the
  # server never logs an invite secret.
  #
  # HONESTY NOTE: as above — validated locally (a known-green local command that
  # this job mirrors) but never run on real GitHub Actions.
  e2e-accounts:
    name: end-to-end account model (real sigild + real CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: sigild/go.sum

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: accounts own vaults and carry entitlement, end to end
        env:
          GO: go
        run: ./cli/tests/e2e-accounts.sh
