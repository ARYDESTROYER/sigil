name: libsigil

on:
  push:
    paths:
      - "libsigil/**"
      - "rust-toolchain.toml"
      - ".github/workflows/libsigil.yml"
  pull_request:
    paths:
      - "libsigil/**"
      - "rust-toolchain.toml"
      - ".github/workflows/libsigil.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libsigil
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup show
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: libsigil
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --all
      - name: wasm build (sigil-core)
        run: cargo build -p sigil-core --target wasm32-unknown-unknown

      # THE core invariant, checked where the core is built. sigil-core takes its
      # entropy from the CALLER (ADR 0007) so it can compile to wasm with no RNG
      # at all; a transitive `getrandom` creeping in would break that silently,
      # because nothing else in this job would fail. Until now the guard ran only
      # in desktop.yml and interop.yml — neither of which is the crate's own gate.
      - name: Assert libsigil stays getrandom-free
        run: |
          count=$(grep -c 'name = "getrandom"' Cargo.lock || true)
          echo "libsigil/Cargo.lock getrandom entries: $count"
          test "$count" -eq 0
