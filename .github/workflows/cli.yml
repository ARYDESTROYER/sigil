name: cli

# ⚠️ `sigild/**` IS IN THE PATH FILTERS ON PURPOSE. `cargo test` here now runs
# `cli/tests/recovery_index_flood.rs`, which BUILDS AND BOOTS A REAL sigild and
# asserts a client contract against it (a flooded per-device envelope index must
# never yield a silent partial recovery). A workflow that names a real-sigild
# suite but is not triggered by a sigild change runs neither for the change that
# breaks it — the exact gap `scripts/gate.sh`'s drift check found in
# `desktop.yml` and `web.yml` on 2026-07-30, and the check that flagged this file
# the moment the test was added.
on:
  push:
    paths:
      - "cli/**"
      - "libsigil/**"
      - "sigild/**"
      - "rust-toolchain.toml"
      - ".github/workflows/cli.yml"
  pull_request:
    paths:
      - "cli/**"
      - "libsigil/**"
      - "sigild/**"
      - "rust-toolchain.toml"
      - ".github/workflows/cli.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup show
          rustup component add rustfmt clippy
      # `recovery_index_flood.rs` builds sigild with `go build ./cmd/server`. It
      # PANICS rather than skipping when Go is absent, deliberately — a suite
      # that silently skips reads exactly like one that passes. `GO: go` is set
      # on the test step because `setup-go` puts go on PATH and NEVER sets $GO
      # (the mistake that left `cors.spec.ts` skipping itself in CI).
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
        env:
          GO: go
      - name: build
        run: cargo build

      # `cli/` is a STANDALONE crate with its own lockfile precisely so it can
      # link `getrandom` natively without polluting the wasm-pure core. This is
      # the job where that separation is most likely to break, so this is where
      # it should be checked: building the CLI must never perturb the core
      # lockfile. (Steps here run in `cli/`, hence the `../`.)
      - name: Assert the CLI has not leaked getrandom into the core
        run: |
          count=$(grep -c 'name = "getrandom"' ../libsigil/Cargo.lock || true)
          echo "libsigil/Cargo.lock getrandom entries: $count"
          test "$count" -eq 0
