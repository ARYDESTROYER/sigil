name: interop

# The cross-component interop suite — the tests that prove the SYSTEM works, as
# opposed to the per-component suites that prove each part works alone.
#
# WHY THIS WORKFLOW EXISTS: these Node tests were, until this workflow was added,
# run by NO workflow at all. They are the only automated proof of several
# load-bearing claims, including the one that matters most:
#   * roundtrip          — seal/open through the wasm in a JS runtime
#   * interop            — SIGILcli container, wasm <-> the REAL sigil binary
#   * hybrid-interop     — SIGILhyb PQ-hybrid container, both directions
#   * sync-interop       — the E2EE sync loop against a LIVE sigild
#   * totp-interop       — cross-client TOTP (CLI writes, browser reads)
#   * migration-interop  — the Google Authenticator codec agrees Rust <-> JS
#   * device-auth-interop— contract v3 against a live device-auth server
#   * sharing-interop    — vault sharing, browser <-> CLI, both directions
#   * pinning-interop    — the KEY-SUBSTITUTION ATTACK is detected and refused
#   * accounts-interop   — the ACCOUNT model: a JS client and the real CLI in ONE
#                          account, and a revoked claimant no longer orphans a vault
#   * recovery-interop   — the recovery-kit codec agrees Rust <-> JS
#   * entitlement-interop— the JS entitlement reader agrees with a REAL sigild
#   * seal-params-guard  — no product re-seal site can silently downgrade Argon2
#   * clock-skew-interop — the clock DIAGNOSTIC agrees Rust <-> JS against a REAL
#                          sigild, offline reads as NO READING (never "fine"),
#                          and `Date` is readable CROSS-ORIGIN
#   * provisioning-interop— the UNTRUSTED-TEXT gate agrees Rust <-> JS over one
#                          table of hostile vectors, the bounds are the GOLDEN
#                          literals, and the ceiling stays INGEST-ONLY so an entry
#                          already in a vault never stops generating codes
# A test nobody runs is a test that rots, and these guard the invariants that
# three separate implementations (Go, Rust, JS) have to agree on.
#
# THREE FURTHER JOBS run the shell end-to-end proofs, which were in the same
# position — written, known-green locally, and executed by nothing:
# e2e-sharing.sh (device-to-device vault sharing), e2e-accounts.sh (accounts own
# vaults and carry entitlement) and e2e-recovery.sh (a printed kit rescues a
# vault, and a first-sight wrap to a kit is refused from every wrapping path).
#
# It is a heavier job than the others because it genuinely needs all three
# toolchains at once: Rust + wasm to build the bindings, Cargo to build the real
# `sigil` binary, Go to build the real `sigild`, and Node to drive them.
#
# HONESTY NOTE: like the repo's other CI mirrors, this workflow is validated
# locally (YAML-parsed, and every step mirrors a known-green local command) but
# has NOT been run on real GitHub Actions from the build machine.

on:
  push:
    paths:
      - "sigil-wasm/**"
      - "cli/**"
      - "sigild/**"
      - "libsigil/**"
      - "rust-toolchain.toml"
      - ".github/workflows/interop.yml"
  pull_request:
    paths:
      - "sigil-wasm/**"
      - "cli/**"
      - "sigild/**"
      - "libsigil/**"
      - "rust-toolchain.toml"
      - ".github/workflows/interop.yml"

permissions:
  contents: read

jobs:
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Prebuilt binaries so build-wasm.sh finds `wasm-pack` / `wasm-bindgen` on
      # PATH under Linux. The wasm-bindgen version is pinned to match the
      # `=0.2.100` dependency in sigil-wasm/Cargo.toml.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.100,wasm-pack

      # Several of these tests build and boot the REAL sigild.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: sigild/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            sigil-wasm
            cli

      # The sigil-wasm crate had NO CI lint/test gate of its own. Its 26 tests
      # include container_header_is_golden and hybrid_container_prefix_is_golden,
      # which guard the SIGILcli / SIGILhyb constants that CLAUDE.md requires to
      # stay byte-identical with cli/src/lib.rs — exactly the kind of mirrored
      # invariant that drifts silently when nothing checks it.
      - name: sigil-wasm rustfmt
        run: cargo fmt --manifest-path sigil-wasm/Cargo.toml --all -- --check
      - name: sigil-wasm clippy
        run: cargo clippy --manifest-path sigil-wasm/Cargo.toml --all-targets -- -D warnings
      - name: sigil-wasm tests (incl. the golden format-constant guards)
        run: cargo test --manifest-path sigil-wasm/Cargo.toml

      # Emits pkg-web + pkg-node. The tests import pkg-node.
      - name: Build the wasm bindings
        run: ./sigil-wasm/build-wasm.sh

      # Built once here so the first test does not pay for it (each test also
      # builds it itself, which is then a cache hit).
      - name: Build the real sigil CLI
        run: cargo build --manifest-path cli/Cargo.toml --bin sigil

      - name: 1/21 wasm seal/open round-trip
        run: node sigil-wasm/test/roundtrip.mjs
      - name: 2/21 SIGILcli container interop with the real CLI
        run: node sigil-wasm/test/interop.mjs
      - name: 3/21 SIGILhyb hybrid public-key interop
        run: node sigil-wasm/test/hybrid-interop.mjs
      - name: 4/21 E2EE sync loop against a live sigild
        run: node sigil-wasm/test/sync-interop.mjs
      - name: 5/21 cross-client TOTP through the opaque op-log
        run: node sigil-wasm/test/totp-interop.mjs
      - name: 6/21 TOTP migration codec agrees Rust and JS
        run: node sigil-wasm/test/migration-interop.mjs
      - name: 7/21 device auth contract v3
        run: node sigil-wasm/test/device-auth-interop.mjs
      - name: 8/21 vault sharing, browser and CLI, both directions
        run: node sigil-wasm/test/sharing-interop.mjs
      # The most important one: proves a hostile server swapping a recipient's
      # hybrid public key is DETECTED and REFUSED, and that the Rust and JS
      # safety numbers agree.
      - name: 9/21 key pinning blocks the substitution attack
        run: node sigil-wasm/test/pinning-interop.mjs
      # Phase 52. A browser-style JS client speaks the ACCOUNT model against a
      # live sigild, and it is the SAME account the real `sigil` CLI joins: the
      # CLI redeems a JS-minted invite, a revoked claimant's sibling still reads
      # AND writes the vault (the orphaning defect this phase exists to fix), a
      # separate account is 403, and the invite negatives (reuse, foreign handle,
      # quota) all hold.
      - name: 10/21 the account model, browser client and CLI in one account
        run: node sigil-wasm/test/accounts-interop.mjs
      # Phase 54. The ONLY automated guard on the Rust <-> JS recovery codec: the
      # Crockford base32 encoding and the HKDF derivation are MIRRORED in
      # libsigil/core/src/recovery.rs and sigil-wasm, and a mirror that drifts
      # does not fail loudly — it silently produces a kit that cannot restore.
      - name: 11/21 the recovery kit agrees across Rust and JS
        run: node sigil-wasm/test/recovery-interop.mjs
      # Phase 56. The ONLY thing in the repo that parses sigild's real entitlement
      # bytes with the JS reader: the browser suites use a test double, so without
      # this a divergence between sigild's entitlementJSON / paymentRequiredResponse
      # and the JS parser would go red in NO job — and the failure mode is a client
      # telling a paying customer the wrong thing about their own subscription.
      - name: 12/21 the entitlement reader agrees with a real sigild
        run: node sigil-wasm/test/entitlement-interop.mjs
      # Phase 59. The ONLY guard on two mirrors that were silently LOSSY: the
      # TotpVault/TotpEntry schema (serde dropped unknown fields; the JS clients
      # rebuilt `{version, entries}` by hand) and the Google Authenticator batch
      # framing (both codecs discarded batch_size/batch_index/batch_id, so the
      # first QR of a multi-QR export imported a fraction and reported success).
      # Neither drift fails loudly — it just loses a user's accounts.
      - name: 13/21 the vault schema and migration batching agree across Rust and JS
        run: node sigil-wasm/test/schema-interop.mjs
      # Phase 59. The ONLY exercise of the passkey user-verification check.
      # Chrome's CDP virtual authenticator cannot produce a "completed but
      # unverified" assertion, so the Playwright passkey suite cannot reach this
      # branch at all — and an unenforced UV means sealing the hardware slot with
      # CTAP's OTHER hmac-secret key, i.e. the exact lockout ADR 0046 exists to
      # prevent.
      - name: 14/21 a passkey ceremony without user verification is refused
        run: node sigil-wasm/test/passkey-uv-interop.mjs
      # Phase 59. A SOURCE-STRUCTURE guard, not a behavioural one: every product
      # re-seal site must ratchet its Argon2 parameters. Behavioural coverage for
      # all six would mean driving an enrolled device and a passkey ceremony
      # through two browsers; a verifier proved that mutating five of the six left
      # webapp 50/50 and extension 14/14 green, so this buys the regression guard
      # for the failure that actually happens — a NEW call site that forgets.
      - name: 15/21 every product re-seal ratchets its Argon2 parameters
        run: node sigil-wasm/test/seal-params-guard.mjs
      # The suites are written on macOS and run here on Linux, and until
      # 2026-07-30 nothing checked that the two agreed: six suites hardcoded
      # /opt/homebrew/bin/go (ENOENT on every runner) and two shell proofs used a
      # `stat -f ... || stat -c ...` idiom that GNU stat does not fail on. Those
      # jobs were red for several phases while the macOS gate printed ALL GREEN.
      # A source check, NOT a Linux run — it guards the two idioms that have
      # actually bitten and cannot prove portability on its own.
      - name: 16/21 no known macOS-only idiom in the suites
        run: node sigil-wasm/test/portability-guard.mjs
      # ⭐⭐ Phase 61. THE HEADLINE PROOF for the multi-device merge: two devices
      # each add an account while offline, both sync, and BOTH hold BOTH with
      # correct codes. Before this, every client adopted `ops[ops.length - 1]`
      # wholesale, so the account added on the device that had not pulled first
      # was destroyed while both devices reported success. Drives a REAL sigild
      # and the REAL `sigil` binary, so the Rust and JS merges must also converge
      # to identical content — a drifted mirror fails here and nowhere else.
      - name: 17/21 the multi-device merge loses nothing, and deletes converge
        run: node sigil-wasm/test/merge-interop.mjs
      # Phase 61. A SOURCE-STRUCTURE guard beside the merge's behavioural proofs:
      # no shipping client may adopt the tip, every removal must tombstone, every
      # import must de-dup by CONTENT not label, and the identity derivation must
      # not be reimplemented in JS. It covers the failure that recurs — a NEW
      # adoption site written later that forgets — not the correctness of the
      # merge itself, which is what the suites above are for.
      - name: 18/21 no shipping client adopts the tip, and every removal tombstones
        run: node sigil-wasm/test/merge-guard.mjs
      # ⭐ The COUNTABLE documentation claims must match the tree. This repo has
      # shipped false doc claims repeatedly — `sigild` "performs no cryptography"
      # while 15 files imported crypto, a threat-model row asserting a defence
      # that did not exist, a fixed 1226-byte envelope that had become
      # variable-length, a Tauri command count that drifted three times, and four
      # already-fixed items still listed as open. This catches the countable
      # class; it cannot check prose, and says so in its own header.
      - name: 19/21 documentation counts match the code
        run: node sigil-wasm/test/docs-claims-guard.mjs
      # ⭐ The CLOCK DIAGNOSTIC. A TOTP code rejected because the device clock
      # drifted is indistinguishable, to the user, from a wrong secret — the most
      # common real-world authenticator failure, and one no client reported. This
      # is the only thing in the repo that parses a REAL sigild's `Date` header
      # with BOTH the JS reader and the real `sigil` binary, checks they agree on
      # the mirrored threshold and the direction, proves an unreachable server
      # reads as NO READING rather than "fine", and proves `Date` is actually
      # readable CROSS-ORIGIN (it is not CORS-safelisted, so that needs sigild's
      # expose list — without it the browser half is silently dead, the exact
      # shape of the CORS defect that hid for twelve phases).
      - name: 20/21 the clock diagnostic agrees across Rust, JS and a real sigild
        run: node sigil-wasm/test/clock-skew-interop.mjs
      # Phase 63. The ONLY guard on the untrusted-text PROVISIONING GATE, which is
      # mirrored between libsigil/core/src/totp.rs (reached by the CLI and the
      # desktop) and sigil-wasm/totp-migration.mjs (reached by both browsers and
      # by the QR scanner). A drift does NOT fail loudly: it produces entries that
      # look completely ordinary on every client. This drives the REAL `sigil`
      # binary and the JS gate over ONE table of hostile vectors, and pins the
      # bounds against GOLDEN LITERALS because a cross-language equality check
      # passes a coordinated rename. It also pins the ingest/read asymmetry, so a
      # "stricter" fix cannot start refusing entries already in someone's vault.
      - name: 21/21 the provisioning gate agrees across Rust and JS
        run: node sigil-wasm/test/provisioning-interop.mjs

      - name: Assert the libsigil core stays getrandom-free
        run: |
          for lock in libsigil/Cargo.lock sigil-wasm/Cargo.lock; do
            count=$(grep -c 'name = "getrandom"' "$lock" || true)
            echo "$lock getrandom entries: $count"
            test "$count" -eq 0
          done

  # A cross-component proof that is a shell script rather than a Node test —
  # which is exactly why it, too, was running in NO workflow before this file
  # existed. It boots a REAL sigild with dev-ops + device auth v3 on a free
  # loopback port and drives the REAL sigil binary as three separate devices to
  # prove device-to-device vault sharing end to end, including the negative half
  # (a third device gets 403s, a revoked device gets 401s) and the zero-knowledge
  # half (the stored bytes are the opaque envelope, and the server logs never
  # contain it). Nothing here is mocked, so nothing here can quietly stop being
  # true without this failing.
  #
  # It needs Go + Rust + bash + curl + python3 (for a free port) and NO wasm, so
  # it is a separate job from the Node suite above and runs in parallel with it.
  #
  # HONESTY NOTE: as above — validated locally (the script is a known-green local
  # command and this job mirrors it) but never run on real GitHub Actions.
  e2e-sharing:
    name: end-to-end vault sharing (real sigild + real CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: sigild/go.sum

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      # The script resolves the Go toolchain from $GO, then Homebrew, then PATH;
      # naming it here keeps the runner off the macOS-only path entirely.
      - name: device-to-device vault sharing, end to end
        env:
          GO: go
        run: ./cli/tests/e2e-sharing.sh

  # The ELEVENTH cross-component proof, added with the Phase 52 account model and
  # in exactly the position `e2e-sharing.sh` was in before this workflow existed:
  # run by nothing. It boots a REAL sigild with dev-ops + device auth and drives
  # the REAL `sigil` binary as several devices to prove that an ACCOUNT — not a
  # device — owns vaults and carries entitlement: a device joins by single-use
  # invite, the vault claimant is revoked and a SIBLING still reads, writes,
  # grants and rotates (the orphaning defect this phase fixes), a device in
  # another account is 403 throughout, a revoked device frees its seat, and the
  # server never logs an invite secret.
  #
  # HONESTY NOTE: as above — validated locally (a known-green local command that
  # this job mirrors) but never run on real GitHub Actions.
  e2e-accounts:
    name: end-to-end account model (real sigild + real CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: sigild/go.sum

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: accounts own vaults and carry entitlement, end to end
        env:
          GO: go
        run: ./cli/tests/e2e-accounts.sh

  # The third shell end-to-end proof, added with the Phase 54 recovery kit. It is
  # the one that proves the kit actually rescues data: a vault is sealed by a
  # device, that device is gone, and ONLY the 56-character printed secret opens it
  # again — plus the negatives that matter more than the positive, namely that a
  # wrong kit recovers nothing and that a first-sight wrap to a recovery kit is
  # REFUSED from every path that can wrap (share, rotate, cover). That refusal is
  # the defence against a server substituting the kit's key, so it is exactly the
  # kind of control that must not rot untested.
  #
  # HONESTY NOTE: as above — validated locally (a known-green local command that
  # this job mirrors) but never run on real GitHub Actions.
  e2e-recovery:
    name: end-to-end recovery kit (real sigild + real CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: sigild/go.sum

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: the recovery kit rescues a vault, and a substituted kit key is refused
        env:
          GO: go
        run: ./cli/tests/e2e-recovery.sh
