name: web

on:
  push:
    paths:
      - "web/**"
      - "sigild/**"
      - "sigil-wasm/**"
      - "libsigil/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "sigild/**"
      - "sigil-wasm/**"
      - "libsigil/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  # The webapp is NOT Rust-free (it compiles the sigil-core to wasm), so it runs
  # in its own job with a Rust toolchain. Mirrors the known-green local gate:
  #   build @sigil/wasm -> typecheck -> lint -> build -> Playwright (incl. the
  #   OFFLINE + axe runtime proofs). Real CI is by-eye until this runs on GitHub.
  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Prebuilt binaries so build.sh finds `wasm-bindgen` on PATH (Linux).
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.100,wasm-pack
      # Go, because tests/cors.spec.ts builds and boots a REAL sigild to prove the
      # webapp can actually reach a server cross-origin. ⚠️ WITHOUT THIS THE SPEC
      # `test.skip`s ITSELF and the job stays green while proving nothing — which
      # is precisely the regression it exists to catch: before the CORS fix, every
      # signed request from the webapp was preflighted and blocked, and a test
      # double that sent Access-Control-Allow-Origin hid it for a whole phase.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: sigild/go.sum
      - run: pnpm install --frozen-lockfile
      - run: corepack pnpm --filter @sigil/wasm build
      # ⚠️ ALSO the NODE-target wasm package. tests/schema.spec.ts opens the app's
      # SEALED container in the TEST process — the only way to prove that a real
      # UI edit preserved fields the app does not understand — and `@sigil/wasm`
      # is a BUNDLER-target package that Node cannot require. Without this step
      # that spec fails to import and the product-level guard is gone.
      - run: ../sigil-wasm/build-wasm.sh
      - run: corepack pnpm --filter webapp typecheck
      - run: corepack pnpm --filter webapp lint
      - run: corepack pnpm --filter webapp build
      - run: corepack pnpm --filter webapp exec playwright install --with-deps chromium
      - run: corepack pnpm --filter webapp exec playwright test
        # Belt and braces with the PATH lookup in cors.spec.ts: setup-go puts `go`
        # on PATH but sets no GO variable, and that spec used to skip itself when
        # GO was unset — leaving the CORS fix with zero browser-level CI proof.
        env:
          GO: go
