name: cli

on:
  push:
    paths:
      - "cli/**"
      - "libsigil/**"
      - "rust-toolchain.toml"
      - ".github/workflows/cli.yml"
  pull_request:
    paths:
      - "cli/**"
      - "libsigil/**"
      - "rust-toolchain.toml"
      - ".github/workflows/cli.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup show
          rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
      - name: build
        run: cargo build

      # `cli/` is a STANDALONE crate with its own lockfile precisely so it can
      # link `getrandom` natively without polluting the wasm-pure core. This is
      # the job where that separation is most likely to break, so this is where
      # it should be checked: building the CLI must never perturb the core
      # lockfile. (Steps here run in `cli/`, hence the `../`.)
      - name: Assert the CLI has not leaked getrandom into the core
        run: |
          count=$(grep -c 'name = "getrandom"' ../libsigil/Cargo.lock || true)
          echo "libsigil/Cargo.lock getrandom entries: $count"
          test "$count" -eq 0
