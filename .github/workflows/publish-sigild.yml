name: publish-sigild

# =============================================================================
# !!! MANUAL-ONLY — STEALTH / PRE-AUDIT !!!  DO NOT ADD AUTO-TRIGGERS.
# -----------------------------------------------------------------------------
# This workflow builds the sigild container image and pushes it to GHCR. It is
# the deploy artifact that the Nomad jobspec (deploy/nomad/sigild.nomad.hcl)
# will reference once an image is published.
#
#   * It is triggered ONLY by `workflow_dispatch` — a human runs it by hand from
#     the Actions tab. There is intentionally NO `push:` and NO `pull_request:`
#     trigger. Sigil is in stealth; nothing builds/publishes automatically.
#     If you find yourself adding an automatic trigger here, STOP — that is a
#     stealth/pre-audit violation.
#
#   * The published GHCR package MUST be set to PRIVATE. GHCR packages default
#     to inheriting repo visibility / can be public — after the first push,
#     verify the package visibility under
#       https://github.com/users/<owner>/packages/container/sigild/settings
#     and set it to Private. Do not leave it public.
#
#   * Secrets are NEVER baked into the image. sigild reads all runtime config
#     (SIGILD_ADDR, SIGILD_POSTGRES_ADDR, SIGILD_REDIS_ADDR, and any future
#     credentials) from the runtime environment only — never image layers.
#
#   * Pre-audit: sigild performs no cryptography and stores no vault data. This
#     image makes no security guarantees.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Extra tag to publish in addition to the short commit SHA
          (defaults to the short SHA).
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Short SHA is the canonical, immutable tag for every build. The optional
      # dispatch input is published alongside it (skipped when left blank).
      - name: Compute tags
        id: meta
        run: |
          short_sha="$(git rev-parse --short HEAD)"
          image="ghcr.io/${{ github.repository_owner }}/sigild"
          tags="${image}:${short_sha}"
          if [ -n "${{ inputs.tag }}" ] && [ "${{ inputs.tag }}" != "${short_sha}" ]; then
            tags="${tags},${image}:${{ inputs.tag }}"
          fi
          {
            echo "short_sha=${short_sha}"
            echo "image=${image}"
            echo "tags=${tags}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push sigild image
        uses: docker/build-push-action@v6
        with:
          context: sigild
          file: sigild/Dockerfile
          build-args: |
            VERSION=${{ steps.meta.outputs.short_sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Published reference
        run: |
          echo "Pushed: ${{ steps.meta.outputs.tags }}"
          echo "REMINDER: ensure the GHCR package 'sigild' is set to PRIVATE."
